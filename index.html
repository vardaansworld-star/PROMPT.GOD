<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Sets the viewport so the website looks great on both mobile phones and desktop screens -->
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>PROMPT.GOD // The Kitchen</title>
    <!-- Google Fonts Preconnecting: Speeds up font loading by establishing an early connection to Google's servers -->
    <link rel="preconnect"href="https://fonts.googleapis.com">
    <link rel="preconnect"href="https://fonts.gstatic.com" crossorigin>
    <!-- Importing Amatic SC for that sketchy, hand-drawn Gen-Z title vibe, and Syne for bold headings -->
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Syne:wght@700&display=swap" rel="stylesheet">
    <!-- Linking our external stylesheet -->
    <link rel="stylesheet"href="style.css">
</head>
<body>
    <!-- Shared Navigation Bar: Allows switching between The Kitchen (generator) and The Vault (pre-made library) -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">⚡ PROMPT.GOD</a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn active">THE KITCHEN</a>
            <a href="vault.html" class="nav-btn">THE VAULT</a>
        </div>
    </nav>
    <!-- Decorative Y2K Stickers: Absolutely useless for functionality, but 100% necessary for the chaotic teenage aesthetic -->
    <div class="sticker s1">🔥 CRINGE-PROOF</div>
    <div class="sticker s2">⚡ NO MORE MID OUTPUTS</div>
    <div class="sticker s3">🤖 GOBLIN MODE</div>
    <!-- Main Container: Holds the core interactive elements and centers them on the screen -->
    <main class="app-container">
        <!-- Hero Section: The big eye-catching title and explanation -->
        <header>
            <h1 class="main-title">COOK GOD-LEVEL PROMPTS</h1>
            <p class="tagline">Stop giving AI basic instructions. Transform messy thoughts into strict, high-performance developer prompts.</p>
        </header>

        <!-- Control Box (The Kitchen): Designed to look like an old-school retro Mac terminal window -->
        <section class="card control-box">
            <!-- Window Header with Mac OS style colored window buttons (red, yellow, green) -->
            <div class="card-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="window-title">prompt_kitchen.exe</span>
            </div>
            <!-- Body of the window containing form inputs -->
            <div class="card-body">
                <label for="user-intent">What is your objective?</label>
                <!-- Textarea where the user types their vague or messy idea -->
                <textarea id="user-intent" placeholder="e.g., explain the 1st law of motion, or write a script to scrape product prices..."></textarea>
                <!-- 2-Column Grid for selecting AI persona and strictness intensity -->
                <div class="settings-grid">
                    <div>
                        <label for="ai-role">AI Persona Override</label>
                        <!-- Dropdown menu to tell the AI who it should act like -->
                        <select id="ai-role">
                            <option value="genius">10x Silicon Valley Architect</option>
                            <option value="brutal">Savage Senior Code Reviewer</option>
                            <option value="academic">Ivy League Research Professor</option>
                            <option value="goblin">Zero-Fluff Output Goblin</option>
                        </select>
                    </div>
                    <div>
                        <label for="intensity">Strictness Level</label>
                        <!-- Range slider from 1 to 3 to adjust how strict/complex the constraints are -->
                        <input type="range" id="intensity" min="1" max="3" value="2">
                    </div>
                </div>
                <!-- Action Button: type="button" prevents page reloads. We listen to clicks on this ID in JS -->
                <button id="generate-btn" type="button" class="action-btn">COOK PROMPT ⚡</button>
            </div>
        </section>
        <!-- Output Window: Initially hidden using the 'invisible' CSS class. JS removes that class when a prompt is cooked -->
        <section class="card output-box invisible" id="output-window">
            <div class="card-header">
                <span class="window-title">optimized_output.txt</span>
                <button id="copy-btn" type="button" class="copy-btn">COPY TO CLIPBOARD</button>
            </div>
            <div class="card-body">
                <!-- The final text generated by JavaScript will be dynamically injected inside this div -->
                <div id="prompt-output" class="output-text"></div>
            </div>
        </section>
    </main>
    <!-- Linking our external JavaScript engine at the very bottom so DOM elements load first -->
    <script src="script.js"></script>
</body>
</html>
